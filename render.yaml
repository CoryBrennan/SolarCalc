databases:
  - name: azimuth-solar-calc-db
    plan: basic-256mb
    postgresMajorVersion: "17"

services:
  - type: web
    name: azimuth-solar-calc-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: azimuth-solar-calc-db
          property: connectionString
